<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./assets/fonts/fonts.css">
<link rel="stylesheet" href="./styles.css?v=4">
<script src="./assets/vendor/three.min.js?v=1"></script>
<script src="./assets/vendor/OrbitControls.js?v=1"></script>
<script src="./assets/vendor/CopyShader.js?v=1"></script>
<script src="./assets/vendor/LuminosityHighPassShader.js?v=1"></script>
<script src="./assets/vendor/EffectComposer.js?v=1"></script>
<script src="./assets/vendor/RenderPass.js?v=1"></script>
<script src="./assets/vendor/ShaderPass.js?v=1"></script>
<script src="./assets/vendor/MaskPass.js?v=1"></script>
<script src="./assets/vendor/UnrealBloomPass.js?v=1"></script>
<script src="./game-data.js?v=32"></script>
<script src="./game-i18n.js?v=33"></script>
<script src="./game-economy.js?v=23"></script>
<script src="./game-story.js?v=3"></script>
<script src="./game-ally.js?v=3"></script>
<script src="./game-sphererender.js?v=3"></script>
<script src="./game-orbits.js?v=2"></script>
<script src="./game-solarsystem3d.js?v=57"></script>
<script src="./game-planetglobe.js?v=5"></script>
<script src="./game-preload.js?v=2"></script>
<script src="./game-save.js?v=10"></script>
<script src="./game.js?v=48"></script>
<script src="./view.js?v=1"></script>
</head>
<body>
<div id="boot-splash">
  <div class="bs-title">MARS: AWAKENING</div>
  <div class="bs-sub">Colony systems initializing</div>
  <div class="bs-bar"><div class="bs-fill"></div></div>
  <div class="bs-status">loading</div>
</div>
<div id="dc-root">
<div style="width:100%;height:100vh;position:relative;overflow:hidden;background:#000306" data-ref="stageRef">
<div style="position:absolute;width:1920px;height:1080px;transform-origin:top left;overflow:hidden;background:#030a10;color:#f3f6f7;font-family:'Space Grotesk',system-ui,sans-serif;user-select:none" data-style="left:${stageLeft};top:${stageTop};transform:${stageTransform}">

  <div style="position:absolute;inset:0;background:#02070b"></div>

  <!-- BUILD VIEWPORT — fills the whole screen behind the UI chrome (top bar,
       panels, icon rail all float above it, like any real strategy game).
       Drag to pan the colony (a world bigger than the screen) sideways.
       Building placement is a plain click; roads/conveyors/pipes are laid by
       click-dragging from one cell to another — never placed automatically. -->
  <div style="position:absolute;inset:0;overflow:hidden" data-on="pointerdown:buildPointerDown;pointermove:buildPointerMove;pointerup:buildPointerUp;pointerleave:buildPointerUp" data-style="cursor:${buildCursor}">
    <div style="position:absolute;background:repeating-linear-gradient(90deg, rgba(222, 230, 234, 0.13) 0px 2px, transparent 2px 240px), repeating-linear-gradient(0deg, rgba(222, 230, 234, 0.13) 0px 2px, transparent 2px 240px), repeating-linear-gradient(90deg, rgba(222, 230, 234, 0.06) 0px, rgba(222, 230, 234, 0.06) 1px, transparent 1px, transparent 60px), repeating-linear-gradient(0deg, rgba(222, 230, 234, 0.06) 0px, rgba(222, 230, 234, 0.06) 1px, transparent 1px, transparent 60px), #050f15;border:1px solid rgba(222, 230, 234, 0.12)" data-style="left:${buildWorldLeft};top:${buildWorldTop};width:${buildWorldW};height:${buildWorldH}">

      <!-- site-boundary hazard frame around the buildable world edge -->
      <div style="position:absolute;left:0;top:0;width:100%;height:9px;background:repeating-linear-gradient(45deg, rgba(225, 160, 53, 0.55) 0 8px, rgba(9, 19, 25, 0.8) 8px 16px);z-index:2;pointer-events:none"></div>
      <div style="position:absolute;left:0;bottom:0;width:100%;height:9px;background:repeating-linear-gradient(45deg, rgba(225, 160, 53, 0.55) 0 8px, rgba(9, 19, 25, 0.8) 8px 16px);z-index:2;pointer-events:none"></div>
      <div style="position:absolute;left:0;top:0;width:9px;height:100%;background:repeating-linear-gradient(45deg, rgba(225, 160, 53, 0.55) 0 8px, rgba(9, 19, 25, 0.8) 8px 16px);z-index:2;pointer-events:none"></div>
      <div style="position:absolute;right:0;top:0;width:9px;height:100%;background:repeating-linear-gradient(45deg, rgba(225, 160, 53, 0.55) 0 8px, rgba(9, 19, 25, 0.8) 8px 16px);z-index:2;pointer-events:none"></div>

      <!-- ORE DEPOSITS: a Mining Rig only produces once built exactly on one -->
      <template data-for="dep in deposits">
        <div style="position:absolute;display:flex;align-items:center;justify-content:center;z-index:1;box-sizing:border-box;pointer-events:none" data-style="left:${dep.leftPx};top:${dep.topPx};width:${dep.sizePx};height:${dep.sizePx};background:${dep.bg};border:1px dashed ${dep.border}">
          <span style="font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700" data-style="color:${dep.border}" data-text="dep.label"></span>
        </div>
      </template>

      <!-- LOGISTICS ZONE: coverage of the hovered / selected depot or hub -->
      <template data-for="lz in logiZones">
        <div style="position:absolute;background:rgba(98, 155, 154, 0.06);z-index:2;box-sizing:border-box;pointer-events:none" data-style="left:${lz.leftPx};top:${lz.topPx};width:${lz.sizePx};height:${lz.sizePx};border:1.5px dashed ${lz.border}"></div>
      </template>

      <!-- LINKS: player-built roads / conveyors / pipelines -->
      <template data-for="lk in buildLinks">
        <div style="position:absolute;z-index:3;box-sizing:border-box" data-class="lk.cls" data-style="left:${lk.leftPx};top:${lk.topPx};width:${lk.wPx};height:${lk.hPx};background:${lk.bg};border:1px solid ${lk.border}"></div>
      </template>
      <!-- HAULERS: motion-path carts running the roads -->
      <template data-for="hl in roadHaulers">
        <div class="hauler" data-style="offset-path:path('${hl.path}');animation-duration:${hl.dur};animation-delay:${hl.delay};animation-direction:${hl.dir}"></div>
      </template>
      <div data-if="linkGhost.visible" hidden="" style="display:contents">
        <template data-for="lg in linkGhost.segs">
          <div style="position:absolute;opacity:0.75;z-index:38;box-sizing:border-box;pointer-events:none" data-style="left:${lg.leftPx};top:${lg.topPx};width:${lg.wPx};height:${lg.hPx};background:${lg.bg};border:1px dashed ${lg.border}"></div>
        </template>
      </div>
      <div data-if="connectorStartGhost.visible" hidden="" style="display:contents">
        <div style="position:absolute;border:2px solid var(--teal);z-index:38;box-sizing:border-box;pointer-events:none" data-style="left:${connectorStartGhost.leftPx};top:${connectorStartGhost.topPx};width:${connectorStartGhost.sizePx};height:${connectorStartGhost.sizePx}"></div>
      </div>

      <!-- PLACED BUILDINGS -->
      <template data-for="pb in placedBuildings">
        <div style="position:absolute;transform:translate(-50%,-50%);z-index:4;box-sizing:border-box;pointer-events:none" data-style="left:${pb.leftPx};top:${pb.topPx};width:${pb.cellPx};height:${pb.cellPx};background:${pb.zoneBg};border:1px solid ${pb.zoneBorder}"></div>
        <button style="position:absolute;transform:translate(-50%,-50%);width:56px;height:56px;box-shadow:0 8px 14px rgba(0, 0, 1, 0.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;z-index:6;padding:0;box-sizing:border-box" data-on="click:pb.onSelect;mouseenter:pb.onEnter;mouseleave:pb.onLeave" data-style="left:${pb.leftPx};top:${pb.topPx};background:${pb.bg};border:1.5px solid ${pb.border};opacity:${pb.opacity}" data-attr="title:${pb.name}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-attr="stroke:${pb.iconColor}">
            <g data-for="ip in pb.icon"><path data-attr="d:${ip}"></path></g>
          </svg>
          <span style="font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.04em;color:#bfc5c9" data-text="pb.mono"></span>
          <div data-if="pb.hasMods" hidden="" style="display:contents">
            <div style="position:absolute;top:-5px;right:-5px;min-width:14px;height:14px;padding:0 3px;background:#5cb572;color:#030a10;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box" data-text="pb.modCount"></div>
          </div>
        </button>
      </template>

      <!-- PLACED MODULES -->
      <template data-for="pm in placedModules">
        <div style="position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;background:rgba(16, 37, 21, 0.85);border:1px solid rgba(92, 181, 114, 0.7);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:8px;color:#8ed09c;z-index:6;box-sizing:border-box" data-style="left:${pm.leftPx};top:${pm.topPx}" data-attr="title:${pm.mono}" data-text="pm.mono"></div>
      </template>

      <!-- FOREIGN BUILDINGS — flavor impression of the ally/rival's presence
           while visiting their sector. Read-only: no click handlers. -->
      <template data-for="fb in foreignBuildings">
        <div style="position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;pointer-events:none;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;z-index:5" data-style="left:${fb.leftPx};top:${fb.topPx};background:${fb.bg};border:1.5px dashed ${fb.color};color:${fb.color}" data-text="fb.mono"></div>
      </template>

      <!-- BUILDING PLACEMENT GHOST -->
      <div data-if="placeGhost.visible" hidden="" style="display:contents">
        <div style="position:absolute;z-index:39;box-sizing:border-box;pointer-events:none" data-style="left:${placeGhost.leftPx};top:${placeGhost.topPx};width:${placeGhost.sizePx};height:${placeGhost.sizePx};background:${placeGhost.bg};border:2px solid ${placeGhost.border}"></div>
      </div>
    </div>

    <!-- blocks clicks from reaching existing buildings while a tool is armed -->
    <div data-if="isPlacing" hidden="" style="display:contents">
      <div style="position:absolute;inset:0;z-index:40" data-style="background:${placeTint}"></div>
    </div>
  </div>

  <!-- INTERFACE LAYER — a separate layer from the game viewport above it.
       The wrapper itself is click-through (pointer-events:none): empty HUD
       space still lets you drag-pan the field beneath it. Every actual
       widget/panel inside re-enables pointer-events on itself. -->
  <div style="position:absolute;inset:0;z-index:10;pointer-events:none">

  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%, transparent 35%, rgba(0, 3, 6, 0.6) 100%);pointer-events:none"><div style="position: absolute; left: 35px; width: 196px; background: rgba(17, 31, 39, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(222, 230, 234, 0.14); padding: 10px; z-index: 10; box-sizing: border-box; top: 797px; pointer-events:auto">
    <button style="position:relative;display:block;width:176px;height:176px;padding:0;background:repeating-linear-gradient(45deg, #0b151c 0px, #0b151c 6px, #0e1a21 6px, #0e1a21 12px);border:1px solid rgba(222, 230, 234, 0.12);overflow:hidden;cursor:pointer" data-on="click:openMap" data-attr="title:${t.mapOpen}">
      <div style="position:absolute;border:1.5px solid var(--teal);background:rgba(0, 140, 116, 0.1);box-sizing:border-box;pointer-events:none" data-style="left:${mapViewport.leftPct};top:${mapViewport.topPct};width:${mapViewport.wPct};height:${mapViewport.hPct}"></div>
      <template data-for="mb in mapBuildings">
        <div style="position:absolute;width:5px;height:5px;background:var(--teal);transform:translate(-50%,-50%);box-shadow:0 0 4px rgba(11, 198, 171, 0.8)" data-style="left:${mb.leftPct};top:${mb.topPct}"></div>
      </template>
    </button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.05em" data-text="t.sectorMap"></span>
      <div style="display:flex;gap:4px">
        <button style="width:18px;height:18px;background:#243037;border:1px solid rgba(222, 230, 234, 0.14);color:#b9bfc2;font-size:11px;line-height:1;cursor:pointer;padding:0" data-on="click:openMap" data-attr="title:${t.mapOpen}">⛶</button>
        <button style="width:18px;height:18px;background:#243037;border:1px solid rgba(222, 230, 234, 0.14);color:#b9bfc2;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center" data-on="click:openSystem" data-attr="title:${t.sysOpen}">
          <div style="position:relative;width:12px;height:12px">
            <div style="position:absolute;left:3.5px;top:3.5px;width:5px;height:5px;border-radius:50%;background:currentColor"></div>
            <div style="position:absolute;left:-1px;top:3.5px;width:14px;height:5px;border:1px solid currentColor;border-radius:50%;transform:rotate(-22deg)"></div>
          </div>
        </button>
        <button style="width:18px;height:18px;background:#243037;border:1px solid rgba(222, 230, 234, 0.14);color:#b9bfc2;font-size:12px;line-height:1;cursor:pointer;padding:0">+</button>
        <button style="width:18px;height:18px;background:#243037;border:1px solid rgba(222, 230, 234, 0.14);color:#b9bfc2;font-size:12px;line-height:1;cursor:pointer;padding:0">−</button>
      </div>
    </div>
  </div></div>

  <!-- PLACEMENT MODE HINT BAR -->
  <div data-if="isPlacing" hidden="" style="display:contents">
    <div style="position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:41;display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(17, 31, 39, 0.96);backdrop-filter:blur(14px);border:1px solid rgba(11, 198, 171, 0.45);box-sizing:border-box;pointer-events:auto">
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.08em;color:var(--teal);text-transform:uppercase" data-text="t.placeMode"></span>
      <span style="font-size:12.5px;color:#e1e5e8"><span data-text="placeHintText"></span> <b style="color:var(--teal)" data-text="placingName"></b></span>
      <button style="background:none;border:1px solid rgba(222, 230, 234, 0.22);color:#b9bfc2;font-size:11px;font-weight:600;padding:6px 12px;cursor:pointer" data-on="click:cancelPlace" data-text="t.cancel"></button>
    </div>
  </div>

  <!-- FOREIGN TERRITORY BANNER — visiting an allied/rival sector: read-only,
       no build shelf; this is the only way back (region tabs live inside the
       build panel, which is hidden here). -->
  <div data-if="foreignBanner.visible" hidden="" style="display:contents">
    <div style="position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:41;display:flex;align-items:center;gap:16px;padding:11px 18px;background:rgba(13, 24, 32, 0.96);backdrop-filter:blur(14px);box-sizing:border-box;pointer-events:auto" data-style="border:1px solid ${foreignBanner.accent}">
      <div>
        <div style="font-size:12.5px;font-weight:600;color:#eef1f4" data-text="foreignBanner.title"></div>
        <div style="font-size:10.5px;color:var(--muted);margin-top:2px" data-text="foreignBanner.hint"></div>
      </div>
      <div data-if="foreignBanner.hasStat" hidden="" style="display:contents">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;white-space:nowrap" data-style="color:${foreignBanner.accent}" data-text="foreignBanner.stat"></span>
      </div>
      <button style="background:none;border:1px solid rgba(222, 230, 234, 0.22);color:#b9bfc2;font-size:11px;font-weight:600;padding:6px 12px;cursor:pointer;white-space:nowrap" data-on="click:foreignBanner.onLeave" data-text="t.sectorReturnHome"></button>
    </div>
  </div>

  <!-- PLACEMENT ERROR TOAST -->
  <div data-if="hasActionError" hidden="" style="display:contents">
    <div style="position:absolute;left:50%;top:132px;transform:translateX(-50%);z-index:42;padding:7px 16px;background:rgba(82, 22, 21, 0.96);backdrop-filter:blur(14px);border:1px solid rgba(224, 97, 92, 0.6);box-sizing:border-box;pointer-events:none">
      <span style="font-size:12px;font-weight:600;color:#f7cbc7" data-text="actionErrorMsg"></span>
    </div>
  </div>

  <!-- TOP BAR -->
  <div style="position:absolute;top:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(17, 31, 39, 0.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(222, 230, 234, 0.1);z-index:10;box-sizing:border-box;pointer-events:auto">
    <div style="display:flex;align-items:center;gap:16px">
      <div style="width:24px;height:24px;background:#008c74;transform:rotate(45deg);flex:none"></div>
      <div>
        <div style="font-size:17px;font-weight:600;line-height:1.1;letter-spacing:0.02em" data-text="colonyName"></div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px" data-text="regionLabel"></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding-left:16px;border-left:1px solid rgba(222, 230, 234, 0.14)" data-attr="title:${t.solDateHint}">
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--teal);letter-spacing:0.04em" data-text="solLabel"></span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#dadfe1;letter-spacing:0.02em" data-text="solTime"></span>
      </div>
      <div style="display:flex;align-items:center;padding-left:12px" data-attr="title:${t.dayNightHint}">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.08em;padding:2px 7px" data-style="color:${dayNightColor};border:1px solid ${dayNightColor}" data-text="dayNightLabel"></span>
      </div>
      <div style="display:flex;align-items:center;gap:3px;padding-left:12px" data-attr="title:${speedHint}">
        <template data-for="sp in speedTabs">
          <button style="min-width:26px;height:22px;padding:0 5px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.02em;cursor:pointer;display:flex;align-items:center;justify-content:center" data-on="click:sp.onClick" data-style="background:${sp.bg};border:1px solid ${sp.border};color:${sp.color}" data-text="sp.label"></button>
        </template>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:30px">
      <template data-for="res in resources">
        <div style="position:relative;display:flex;align-items:center;gap:8px;cursor:default;height:68px" data-on="mouseenter:res.onEnter;mouseleave:res.onLeave" data-attr="title:${res.label}">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-attr="stroke:${res.dotColor}">
            <g data-for="ip in res.icon"><path data-attr="d:${ip}"></path></g>
          </svg>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:0.04em" data-text="res.code"></span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:#f3f6f7" data-text="res.value"></span>

          <div data-if="res.showPopup" hidden="" style="display:contents">
            <div style="position:absolute;top:60px;left:-16px;width:250px;background:rgba(11, 24, 31, 0.98);backdrop-filter:blur(14px);border:1px solid rgba(11, 198, 171, 0.3);padding:14px 16px;z-index:30;animation:panelIn 0.14s ease-out;box-sizing:border-box">
              <div style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--teal);margin-bottom:10px" data-text="res.popup.title"></div>

              <div data-if="res.popup.kind === 'flow'" hidden="" style="display:contents">
                <div style="font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;color:#6e767b;margin-bottom:3px" data-text="t.detIncome"></div>
                <template data-for="ln in res.popup.income">
                  <div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0"><span style="color:#babec1" data-text="ln.label"></span><span style="font-family:'JetBrains Mono',monospace;color:#5cb572" data-text="ln.val"></span></div>
                </template>
                <div style="font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;color:#6e767b;margin:8px 0 3px" data-text="t.detExpense"></div>
                <template data-for="ln in res.popup.expense">
                  <div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0"><span style="color:#babec1" data-text="ln.label"></span><span style="font-family:'JetBrains Mono',monospace;color:#eea743" data-text="ln.val"></span></div>
                </template>
                <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;border-top:1px solid rgba(222, 230, 234, 0.12);margin-top:7px;padding-top:7px"><span data-text="t.detNet"></span><span class="mono-teal" data-text="res.popup.net"></span></div>
              </div>

              <div data-if="res.popup.kind === 'pop'" hidden="" style="display:contents">
                <div style="height:5px;background:#243037;margin-bottom:10px;overflow:hidden"><div style="height:100%;background:#009880" data-style="width:${res.popup.barPct}"></div></div>
                <template data-for="ln in res.popup.lines">
                  <div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid rgba(222, 230, 234, 0.05)"><span class="muted" data-text="ln.label"></span><span style="font-family:'JetBrains Mono',monospace;color:#dadfe1" data-text="ln.val"></span></div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>

      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase" data-text="t.ecoIndex"></span>
        <div style="width:96px;height:6px;background:#243037;border-radius:3px;overflow:hidden">
          <div style="height:100%;background:#009880" data-style="width:${ecoBarWidth}"></div>
        </div>
        <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:var(--teal);min-width:30px" data-text="ecoIndexDisplay"></span>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px">

              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(17, 31, 39, 0.6);border:1px solid rgba(222, 230, 234, 0.1)">
                <span style="font-size:13px" data-text="launch.setMusic"></span>
                <div style="display:flex;align-items:center;gap:8px">
                  <button style="width:24px;height:24px;background:rgba(16, 34, 43, 0.8);border:1px solid rgba(222, 230, 234, 0.16);color:#c9cfd2;cursor:pointer;padding:0" data-on="click:setMusicDown">−</button>
                  <span style="font-family:'JetBrains Mono',monospace;font-size:12px;min-width:38px;text-align:center" data-text="musicVolPct"></span>
                  <button style="width:24px;height:24px;background:rgba(16, 34, 43, 0.8);border:1px solid rgba(222, 230, 234, 0.16);color:#c9cfd2;cursor:pointer;padding:0" data-on="click:setMusicUp">+</button>
                </div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(17, 31, 39, 0.6);border:1px solid rgba(222, 230, 234, 0.1)">
                <span style="font-size:13px" data-text="launch.setMotion"></span>
                <button style="width:36px;height:20px;border-radius:10px;border:none;cursor:pointer;position:relative;padding:0" data-on="click:togglePrefReduceMotion" data-style="background:${pmTrackColor}">
                  <div style="width:16px;height:16px;border-radius:50%;background:#f3f6f7;position:absolute;top:2px;transition:left 0.15s" data-style="left:${pmKnobLeft}"></div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style="position:absolute;left:96px;bottom:40px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#52595e;z-index:3" data-text="launch.studio"></div>
      <div style="position:absolute;right:48px;bottom:40px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#52595e;z-index:3" data-text="launch.build"></div>
    </div>
  </div>

  <!-- GAME MENU -->
  <div data-if="isMenuOpen" hidden="" style="display:contents">
    <div style="position:absolute;inset:0;z-index:60;background:rgba(1, 5, 10, 0.98);animation:overlayIn 0.18s ease-out;overflow:hidden">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg, #02080e 0px, #02080e 60px, #030d13 60px, #030d13 120px)"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%, transparent 30%, rgba(0, 3, 6, 0.7) 100%)"></div>

      <button style="position:absolute;top:32px;right:40px;background:none;border:1px solid rgba(222, 230, 234, 0.16);color:#b9bfc2;font-size:13px;padding:8px 16px;cursor:pointer;z-index:2" data-on="click:closeMenu" data-attr="title:${t.close}" data-text="t.close"></button>

      <div style="position:absolute;left:72px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;z-index:2">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:8px">
          <div style="width:22px;height:22px;background:#008c74;transform:rotate(45deg);flex:none"></div>
          <div style="font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--teal)" data-text="t.menuTitle"></div>
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#747c80;letter-spacing:0.06em;margin-bottom:34px"><span data-text="colonyName"></span> · <span data-text="t.sectorSub"></span></div>

        <div style="display:flex;flex-direction:column;gap:4px">
          <template data-for="mi in menuItems">
            <button style="text-align:left;padding:10px 20px 10px 0;background:none;border:none;padding-left:18px;font-family:'Space Grotesk',system-ui,sans-serif;font-size:24px;font-weight:600;letter-spacing:0.01em;cursor:pointer;transition:padding-left 0.12s" data-on="click:mi.onClick" data-style="border-left:2px solid ${mi.accent};color:${mi.color}" data-text="mi.label"></button>
          </template>
        </div>
      </div>

      <div style="position:absolute;left:72px;bottom:36px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#575f63;letter-spacing:0.08em;z-index:2" data-text="t.menuVersion"></div>
    </div>
  </div>

  <!-- STORY DIALOGUE — non-blocking; a bottom-centre panel, the sim keeps running -->
  <div data-if="storyModal.open" hidden="" style="display:contents">
    <div style="position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:680px;max-width:calc(100% - 56px);max-height:440px;overflow-y:auto;z-index:45;background:rgba(13, 24, 32, 0.96);backdrop-filter:blur(14px);border:1px solid rgba(222, 230, 234, 0.16);box-shadow:0 18px 44px rgba(0,0,0,0.5);animation:panelIn 0.18s ease-out;box-sizing:border-box;pointer-events:auto">
      <div style="display:flex;align-items:center;gap:13px;padding:14px 22px;border-bottom:1px solid rgba(222, 230, 234, 0.1)">
        <div style="width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#0d1820" data-style="background:${storyModal.glyphColor}" data-text="storyModal.glyph"></div>
        <div style="min-width:0;display:flex;align-items:baseline;gap:10px">
          <div style="font-size:14px;font-weight:600;letter-spacing:0.01em" data-text="storyModal.speakerName"></div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)" data-text="storyModal.speakerRole"></div>
        </div>
      </div>

      <div style="padding:16px 22px;font-size:14px;line-height:1.6;color:#e7ecef" data-text="storyModal.text"></div>

      <div style="display:flex;flex-direction:column;gap:7px;padding:2px 18px 18px">
        <template data-for="c in storyModal.choices">
          <button style="text-align:left;padding:11px 15px;background:rgba(23, 37, 46, 0.6);cursor:pointer;box-sizing:border-box" data-on="click:c.onChoose" data-attr="disabled:${c.locked}" data-style="border:1px solid ${c.borderColor};color:${c.rowColor}">
            <span style="font-size:13px;line-height:1.4;display:block" data-text="c.label"></span>
            <span data-if="c.hasHint" hidden="" style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--teal);margin-top:4px" data-text="c.hint"></span>
            <span data-if="c.locked" hidden="" style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:4px" data-text="c.lockLabel"></span>
          </button>
        </template>
      </div>
    </div>
  </div>

</div>
</div>
</div>
<script>
  (function () {
    var Component = window.__defineGameComponent(window.__View, window.__viewReact);
    window.__mountView(Component, document.getElementById('dc-root'));
  })();
</script>
</body>
</html>
