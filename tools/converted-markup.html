

<div style="width:100%;height:100vh;position:relative;overflow:hidden;background:oklch(9% 0.02 235)" data-ref="stageRef">
<div style="position:absolute;width:1920px;height:1080px;transform-origin:top left;overflow:hidden;background:oklch(14% 0.02 235);color:oklch(97% 0.004 235);font-family:'Space Grotesk',system-ui,sans-serif;user-select:none" data-style="left:${stageLeft};top:${stageTop};transform:${stageTransform}">

  <div style="position:absolute;inset:0;background:oklch(12% 0.018 235)"></div>

  <!-- BUILD VIEWPORT — fills the whole screen behind the UI chrome (top bar,
       panels, icon rail all float above it, like any real strategy game).
       Drag to pan the colony (a world bigger than the screen) sideways.
       Building placement is a plain click; roads/conveyors/pipes are laid by
       click-dragging from one cell to another — never placed automatically. -->
  <div style="position:absolute;inset:0;overflow:hidden" data-on="pointerdown:buildPointerDown;pointermove:buildPointerMove;pointerup:buildPointerUp;pointerleave:buildPointerUp" data-style="cursor:${buildCursor}">
    <div style="position:absolute;background:repeating-linear-gradient(90deg, oklch(92% 0.01 235 / 0.13) 0px 2px, transparent 2px 240px), repeating-linear-gradient(0deg, oklch(92% 0.01 235 / 0.13) 0px 2px, transparent 2px 240px), repeating-linear-gradient(90deg, oklch(92% 0.01 235 / 0.06) 0px, oklch(92% 0.01 235 / 0.06) 1px, transparent 1px, transparent 60px), repeating-linear-gradient(0deg, oklch(92% 0.01 235 / 0.06) 0px, oklch(92% 0.01 235 / 0.06) 1px, transparent 1px, transparent 60px), oklch(16% 0.02 235);border:1px solid oklch(92% 0.01 235 / 0.12)" data-style="left:${buildWorldLeft};top:${buildWorldTop};width:${buildWorldW};height:${buildWorldH}">

      <!-- site-boundary hazard frame around the buildable world edge -->
      <div style="position:absolute;left:0;top:0;width:100%;height:9px;background:repeating-linear-gradient(45deg, oklch(75% 0.14 75 / 0.55) 0 8px, oklch(18% 0.02 235 / 0.8) 8px 16px);z-index:2;pointer-events:none"></div>
      <div style="position:absolute;left:0;bottom:0;width:100%;height:9px;background:repeating-linear-gradient(45deg, oklch(75% 0.14 75 / 0.55) 0 8px, oklch(18% 0.02 235 / 0.8) 8px 16px);z-index:2;pointer-events:none"></div>
      <div style="position:absolute;left:0;top:0;width:9px;height:100%;background:repeating-linear-gradient(45deg, oklch(75% 0.14 75 / 0.55) 0 8px, oklch(18% 0.02 235 / 0.8) 8px 16px);z-index:2;pointer-events:none"></div>
      <div style="position:absolute;right:0;top:0;width:9px;height:100%;background:repeating-linear-gradient(45deg, oklch(75% 0.14 75 / 0.55) 0 8px, oklch(18% 0.02 235 / 0.8) 8px 16px);z-index:2;pointer-events:none"></div>

      <!-- ORE DEPOSITS: a Mining Rig only produces once built exactly on one -->
      <template data-for="dep in deposits">
        <div style="position:absolute;display:flex;align-items:center;justify-content:center;z-index:1;box-sizing:border-box;pointer-events:none" data-style="left:${dep.leftPx};top:${dep.topPx};width:${dep.sizePx};height:${dep.sizePx};background:${dep.bg};border:1px dashed ${dep.border}">
          <span style="font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700" data-style="color:${dep.border}" data-text="dep.label"></span>
        </div>
      </template>

      <!-- LOGISTICS ZONE: coverage of the hovered / selected depot or hub -->
      <template data-for="lz in logiZones">
        <div style="position:absolute;background:oklch(65% 0.06 195 / 0.06);z-index:2;box-sizing:border-box;pointer-events:none" data-style="left:${lz.leftPx};top:${lz.topPx};width:${lz.sizePx};height:${lz.sizePx};border:1.5px dashed ${lz.border}"></div>
      </template>

      <!-- LINKS: player-built roads / conveyors / pipelines -->
      <template data-for="lk in buildLinks">
        <div style="position:absolute;z-index:3;box-sizing:border-box" data-class="lk.cls" data-style="left:${lk.leftPx};top:${lk.topPx};width:${lk.wPx};height:${lk.hPx};background:${lk.bg};border:1px solid ${lk.border}"></div>
      </template>
      <!-- HAULERS: motion-path carts running the roads -->
      <template data-for="hl in roadHaulers">
        <div class="hauler" data-style="offset-path:path('${hl.path}');animation-duration:${hl.dur};animation-delay:${hl.delay};animation-direction:${hl.dir}"></div>
      </template>
      <div data-if="linkGhost.visible" hidden="" style="display:contents">
        <template data-for="lg in linkGhost.segs">
          <div style="position:absolute;opacity:0.75;z-index:38;box-sizing:border-box;pointer-events:none" data-style="left:${lg.leftPx};top:${lg.topPx};width:${lg.wPx};height:${lg.hPx};background:${lg.bg};border:1px dashed ${lg.border}"></div>
        </template>
      </div>
      <div data-if="connectorStartGhost.visible" hidden="" style="display:contents">
        <div style="position:absolute;border:2px solid var(--teal);z-index:38;box-sizing:border-box;pointer-events:none" data-style="left:${connectorStartGhost.leftPx};top:${connectorStartGhost.topPx};width:${connectorStartGhost.sizePx};height:${connectorStartGhost.sizePx}"></div>
      </div>

      <!-- PLACED BUILDINGS -->
      <template data-for="pb in placedBuildings">
        <div style="position:absolute;transform:translate(-50%,-50%);z-index:4;box-sizing:border-box;pointer-events:none" data-style="left:${pb.leftPx};top:${pb.topPx};width:${pb.cellPx};height:${pb.cellPx};background:${pb.zoneBg};border:1px solid ${pb.zoneBorder}"></div>
        <button style="position:absolute;transform:translate(-50%,-50%);width:56px;height:56px;box-shadow:0 8px 14px oklch(4% 0.02 235 / 0.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;z-index:6;padding:0;box-sizing:border-box" data-on="click:pb.onSelect;mouseenter:pb.onEnter;mouseleave:pb.onLeave" data-style="left:${pb.leftPx};top:${pb.topPx};background:${pb.bg};border:1.5px solid ${pb.border};opacity:${pb.opacity}" data-attr="title:${pb.name}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-attr="stroke:${pb.iconColor}">
            <g data-for="ip in pb.icon"><path data-attr="d:${ip}"></path></g>
          </svg>
          <span style="font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.04em;color:oklch(82% 0.008 235)" data-text="pb.mono"></span>
          <div data-if="pb.hasMods" hidden="" style="display:contents">
            <div style="position:absolute;top:-5px;right:-5px;min-width:14px;height:14px;padding:0 3px;background:oklch(70% 0.13 150);color:oklch(14% 0.02 235);font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box" data-text="pb.modCount"></div>
          </div>
        </button>
      </template>

      <!-- PLACED MODULES -->
      <template data-for="pm in placedModules">
        <div style="position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;background:oklch(24% 0.04 150 / 0.85);border:1px solid oklch(70% 0.13 150 / 0.7);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:8px;color:oklch(80% 0.1 150);z-index:6;box-sizing:border-box" data-style="left:${pm.leftPx};top:${pm.topPx}" data-attr="title:${pm.mono}" data-text="pm.mono"></div>
      </template>

      <!-- BUILDING PLACEMENT GHOST -->
      <div data-if="placeGhost.visible" hidden="" style="display:contents">
        <div style="position:absolute;z-index:39;box-sizing:border-box;pointer-events:none" data-style="left:${placeGhost.leftPx};top:${placeGhost.topPx};width:${placeGhost.sizePx};height:${placeGhost.sizePx};background:${placeGhost.bg};border:2px solid ${placeGhost.border}"></div>
      </div>
    </div>

    <!-- blocks clicks from reaching existing buildings while a tool is armed -->
    <div data-if="isPlacing" hidden="" style="display:contents">
      <div style="position:absolute;inset:0;z-index:40" data-style="background:${placeTint}"></div>
    </div>
  </div>

  <!-- INTERFACE LAYER — a separate layer from the game viewport above it.
       The wrapper itself is click-through (pointer-events:none): empty HUD
       space still lets you drag-pan the field beneath it. Every actual
       widget/panel inside re-enables pointer-events on itself. -->
  <div style="position:absolute;inset:0;z-index:10;pointer-events:none">

  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%, transparent 35%, oklch(9% 0.02 235 / 0.6) 100%);pointer-events:none"><div style="position: absolute; left: 35px; width: 196px; background: oklch(23% 0.025 235 / 0.85); backdrop-filter: blur(14px); border: 1px solid oklch(92% 0.01 235 / 0.14); padding: 10px; z-index: 10; box-sizing: border-box; top: 797px; pointer-events:auto">
    <button style="position:relative;display:block;width:176px;height:176px;padding:0;background:repeating-linear-gradient(45deg, oklch(19% 0.02 235) 0px, oklch(19% 0.02 235) 6px, oklch(21% 0.022 235) 6px, oklch(21% 0.022 235) 12px);border:1px solid oklch(92% 0.01 235 / 0.12);overflow:hidden;cursor:pointer" data-on="click:openMap" data-attr="title:${t.mapOpen}">
      <div style="position:absolute;border:1.5px solid var(--teal);background:oklch(56% 0.13 178 / 0.1);box-sizing:border-box;pointer-events:none" data-style="left:${mapViewport.leftPct};top:${mapViewport.topPct};width:${mapViewport.wPct};height:${mapViewport.hPct}"></div>
      <template data-for="mb in mapBuildings">
        <div style="position:absolute;width:5px;height:5px;background:var(--teal);transform:translate(-50%,-50%);box-shadow:0 0 4px oklch(74% 0.135 178 / 0.8)" data-style="left:${mb.leftPct};top:${mb.topPct}"></div>
      </template>
    </button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.05em" data-text="t.sectorMap"></span>
      <div style="display:flex;gap:4px">
        <button style="width:18px;height:18px;background:oklch(30% 0.02 235);border:1px solid oklch(92% 0.01 235 / 0.14);color:oklch(80% 0.008 235);font-size:11px;line-height:1;cursor:pointer;padding:0" data-on="click:openMap" data-attr="title:${t.mapOpen}">⛶</button>
        <button style="width:18px;height:18px;background:oklch(30% 0.02 235);border:1px solid oklch(92% 0.01 235 / 0.14);color:oklch(80% 0.008 235);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center" data-on="click:openSystem" data-attr="title:${t.sysOpen}">
          <div style="position:relative;width:12px;height:12px">
            <div style="position:absolute;left:3.5px;top:3.5px;width:5px;height:5px;border-radius:50%;background:currentColor"></div>
            <div style="position:absolute;left:-1px;top:3.5px;width:14px;height:5px;border:1px solid currentColor;border-radius:50%;transform:rotate(-22deg)"></div>
          </div>
        </button>
        <button style="width:18px;height:18px;background:oklch(30% 0.02 235);border:1px solid oklch(92% 0.01 235 / 0.14);color:oklch(80% 0.008 235);font-size:12px;line-height:1;cursor:pointer;padding:0">+</button>
        <button style="width:18px;height:18px;background:oklch(30% 0.02 235);border:1px solid oklch(92% 0.01 235 / 0.14);color:oklch(80% 0.008 235);font-size:12px;line-height:1;cursor:pointer;padding:0">−</button>
      </div>
    </div>
  </div></div>

  <!-- PLACEMENT MODE HINT BAR -->
  <div data-if="isPlacing" hidden="" style="display:contents">
    <div style="position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:41;display:flex;align-items:center;gap:14px;padding:10px 16px;background:oklch(23% 0.025 235 / 0.96);backdrop-filter:blur(14px);border:1px solid oklch(74% 0.135 178 / 0.45);box-sizing:border-box;pointer-events:auto">
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.08em;color:var(--teal);text-transform:uppercase" data-text="t.placeMode"></span>
      <span style="font-size:12.5px;color:oklch(92% 0.006 235)"><span data-text="placeHintText"></span> <b style="color:var(--teal)" data-text="placingName"></b></span>
      <button style="background:none;border:1px solid oklch(92% 0.01 235 / 0.22);color:oklch(80% 0.008 235);font-size:11px;font-weight:600;padding:6px 12px;cursor:pointer" data-on="click:cancelPlace" data-text="t.cancel"></button>
    </div>
  </div>

  <!-- PLACEMENT ERROR TOAST -->
  <div data-if="hasActionError" hidden="" style="display:contents">
    <div style="position:absolute;left:50%;top:132px;transform:translateX(-50%);z-index:42;padding:7px 16px;background:oklch(30% 0.09 25 / 0.96);backdrop-filter:blur(14px);border:1px solid oklch(65% 0.16 25 / 0.6);box-sizing:border-box;pointer-events:none">
      <span style="font-size:12px;font-weight:600;color:oklch(88% 0.05 25)" data-text="actionErrorMsg"></span>
    </div>
  </div>

  <!-- TOP BAR -->
  <div style="position:absolute;top:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:oklch(23% 0.025 235 / 0.82);backdrop-filter:blur(14px);border-bottom:1px solid oklch(92% 0.01 235 / 0.1);z-index:10;box-sizing:border-box;pointer-events:auto">
    <div style="display:flex;align-items:center;gap:16px">
      <div style="width:24px;height:24px;background:oklch(56% 0.13 178);transform:rotate(45deg);flex:none"></div>
      <div>
        <div style="font-size:17px;font-weight:600;line-height:1.1;letter-spacing:0.02em" data-text="colonyName"></div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px" data-text="t.sectorSub"></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding-left:16px;border-left:1px solid oklch(92% 0.01 235 / 0.14)" data-attr="title:${t.solDateHint}">
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--teal);letter-spacing:0.04em" data-text="solLabel"></span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(90% 0.006 235);letter-spacing:0.02em" data-text="solTime"></span>
      </div>
      <div style="display:flex;align-items:center;padding-left:12px" data-attr="title:${t.dayNightHint}">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.08em;padding:2px 7px" data-style="color:${dayNightColor};border:1px solid ${dayNightColor}" data-text="dayNightLabel"></span>
      </div>
      <div style="display:flex;align-items:center;gap:3px;padding-left:12px" data-attr="title:${speedHint}">
        <template data-for="sp in speedTabs">
          <button style="min-width:26px;height:22px;padding:0 5px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.02em;cursor:pointer;display:flex;align-items:center;justify-content:center" data-on="click:sp.onClick" data-style="background:${sp.bg};border:1px solid ${sp.border};color:${sp.color}" data-text="sp.label"></button>
        </template>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:30px">
      <template data-for="res in resources">
        <div style="position:relative;display:flex;align-items:center;gap:8px;cursor:default;height:68px" data-on="mouseenter:res.onEnter;mouseleave:res.onLeave" data-attr="title:${res.label}">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-attr="stroke:${res.dotColor}">
            <g data-for="ip in res.icon"><path data-attr="d:${ip}"></path></g>
          </svg>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:0.04em" data-text="res.code"></span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:oklch(97% 0.004 235)" data-text="res.value"></span>

          <div data-if="res.showPopup" hidden="" style="display:contents">
            <div style="position:absolute;top:60px;left:-16px;width:250px;background:oklch(20% 0.024 235 / 0.98);backdrop-filter:blur(14px);border:1px solid oklch(74% 0.135 178 / 0.3);padding:14px 16px;z-index:30;animation:panelIn 0.14s ease-out;box-sizing:border-box">
              <div style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--teal);margin-bottom:10px" data-text="res.popup.title"></div>

              <div data-if="res.popup.kind === 'flow'" hidden="" style="display:contents">
                <div style="font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;color:oklch(56% 0.012 235);margin-bottom:3px" data-text="t.detIncome"></div>
                <template data-for="ln in res.popup.income">
                  <div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0"><span style="color:oklch(80% 0.006 235)" data-text="ln.label"></span><span style="font-family:'JetBrains Mono',monospace;color:oklch(70% 0.13 150)" data-text="ln.val"></span></div>
                </template>
                <div style="font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;color:oklch(56% 0.012 235);margin:8px 0 3px" data-text="t.detExpense"></div>
                <template data-for="ln in res.popup.expense">
                  <div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0"><span style="color:oklch(80% 0.006 235)" data-text="ln.label"></span><span style="font-family:'JetBrains Mono',monospace;color:oklch(78% 0.14 72)" data-text="ln.val"></span></div>
                </template>
                <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;border-top:1px solid oklch(92% 0.01 235 / 0.12);margin-top:7px;padding-top:7px"><span data-text="t.detNet"></span><span class="mono-teal" data-text="res.popup.net"></span></div>
              </div>

              <div data-if="res.popup.kind === 'pop'" hidden="" style="display:contents">
                <div style="height:5px;background:oklch(30% 0.02 235);margin-bottom:10px;overflow:hidden"><div style="height:100%;background:oklch(60% 0.13 178)" data-style="width:${res.popup.barPct}"></div></div>
                <template data-for="ln in res.popup.lines">
                  <div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid oklch(92% 0.01 235 / 0.05)"><span class="muted" data-text="ln.label"></span><span style="font-family:'JetBrains Mono',monospace;color:oklch(90% 0.006 235)" data-text="ln.val"></span></div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>

      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase" data-text="t.ecoIndex"></span>
        <div style="width:96px;height:6px;background:oklch(30% 0.02 235);border-radius:3px;overflow:hidden">
          <div style="height:100%;background:oklch(60% 0.13 178)" data-style="width:${ecoBarWidth}"></div>
        </div>
        <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:var(--teal);min-width:30px" data-text="ecoIndexDisplay"></span>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px">
      <div style="display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border:1px solid oklch(92% 0.01 235 / 0.14);background:oklch(26% 0.02 235 / 0.5);box-sizing:border-box">
        <audio preload="metadata" style="display:none" data-ref="audioRef" data-on="timeupdate:onAudioTime;loadedmetadata:onAudioMeta;durationchange:onAudioDur;play:onAudioPlay;pause:onAudioPause;ended:onAudioEnded"></audio>
        <button title="Prev" style="width:16px;height:16px;background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center" data-on="click:musicPrev">
          <div style="width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:7px solid oklch(80% 0.008 235)"></div>
        </button>
        <button title="Play / Pause" style="width:22px;height:22px;background:oklch(56% 0.13 178 / 0.16);border:1px solid oklch(56% 0.13 178 / 0.45);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center" data-on="click:toggleMusic">
          <div data-if="musicPaused" hidden="" style="display:contents">
            <div style="width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid var(--teal);margin-left:2px"></div>
          </div>
          <div data-if="musicPlaying" hidden="" style="display:contents">
            <div style="display:flex;gap:2px"><div style="width:3px;height:9px;background:var(--teal)"></div><div style="width:3px;height:9px;background:var(--teal)"></div></div>
          </div>
        </button>
        <button title="Next" style="width:16px;height:16px;background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center" data-on="click:musicNext">
          <div style="width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid oklch(80% 0.008 235)"></div>
        </button>
        <div style="display:flex;flex-direction:column;justify-content:center;gap:3px;width:118px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px">
            <span style="font-size:10px;color:oklch(88% 0.006 235);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" data-attr="title:${musicArtist} — ${musicTitle}" data-text="musicTitle"></span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:8px;color:oklch(55% 0.012 235);flex:none"><span data-text="musicElapsed"></span> / <span data-text="musicTotal"></span></span>
          </div>
          <div style="height:3px;background:oklch(32% 0.02 235);overflow:hidden"><div style="height:100%;background:oklch(60% 0.13 178)" data-style="width:${musicPct}"></div></div>
        </div>
